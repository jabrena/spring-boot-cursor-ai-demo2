spring.application.name=actor-service
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Cloud CircuitBreaker with Resilience4j Configuration
spring.cloud.circuitbreaker.resilience4j.enabled=true
spring.cloud.circuitbreaker.resilience4j.instances.actorService.registerHealthIndicator=true
spring.cloud.circuitbreaker.resilience4j.instances.actorService.slidingWindowSize=10
spring.cloud.circuitbreaker.resilience4j.instances.actorService.minimumNumberOfCalls=5
spring.cloud.circuitbreaker.resilience4j.instances.actorService.permittedNumberOfCallsInHalfOpenState=3
spring.cloud.circuitbreaker.resilience4j.instances.actorService.automaticTransitionFromOpenToHalfOpenEnabled=true
spring.cloud.circuitbreaker.resilience4j.instances.actorService.waitDurationInOpenState=5s
spring.cloud.circuitbreaker.resilience4j.instances.actorService.failureRateThreshold=50
spring.cloud.circuitbreaker.resilience4j.instances.actorService.eventConsumerBufferSize=10

# Actuator endpoint for monitoring circuit breaker status
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
